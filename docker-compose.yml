# Desde capstone/: ./run.sh
# Levanta Redis, Phoenix, la API (el worker corre en el mismo proceso) y el frontend.
# Secretos, índice y nombre de modelo solo en api/.env. Este archivo no los trae.

services:
  redis:
    image: redis:8
    # AOF en /data, el dir de la imagen. El volumen nombrado sobrevive a
    # `docker compose down` sin -v; el anónimo de la imagen no.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${CAPSTONE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      # El collector que usa la API es HTTP, por el nombre del servicio, puerto 6006.
      # 4317 no se publica: en esta máquina suele estar tomado por otra pre-entrega.
      - "${CAPSTONE_PHOENIX_PORT:-6006}:6006"

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file:
      - path: ./api/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_PROJECT: gastos-hogar
      FRONTEND_ORIGIN: http://localhost:5173
      SQLITE_PATH: /app/data/gastos.db
    extra_hosts:
      # LM Studio escucha en el host. 127.0.0.1 dentro del contenedor no es esa máquina.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && exec npx vite --host 0.0.0.0 --port 5173 --strictPort",
      ]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
  redis_data:
